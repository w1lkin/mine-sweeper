<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>扫雷</title>
  <meta name="description" content="经典扫雷，三档难度、最近战绩本地保存，支持分享卡片。">
  <meta property="og:title" content="扫雷">
  <meta property="og:description" content="经典扫雷，三档难度，挑战你的最快通关纪录！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mine-sweeper-2f1.pages.dev/">
  <meta property="og:image" content="https://mine-sweeper-2f1.pages.dev/share-card.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>扫雷</h1>
      <div class="stats">
        <span id="mine-count">💣 0</span>
        <span id="timer">⏱ 0</span>
      </div>
    </header>

    <section class="difficulty">
      <button data-diff="easy" class="active">初级 9×9</button>
      <button data-diff="medium">中级 16×16</button>
      <button data-diff="hard">高级 30×16</button>
    </section>

    <div class="controls">
      <label class="toggle"><input type="checkbox" id="autoflag-toggle"> <span>自动标雷</span></label>
      <button id="pause-btn" type="button">⏸ 暂停</button>
      <button id="immerse-btn" type="button">🙈 沉浸</button>
    </div>

    <div class="board-wrap">
      <section id="board" class="board"></section>
      <div id="pause-overlay" class="pause-overlay">
        <div class="fake-excel">
          <div class="fx-title">表格文档 · Q3预算执行表.xlsx</div>
          <div class="fx-ribbon"><span>文件</span><span>开始</span><span>插入</span><span>页面布局</span><span>公式</span><span>数据</span><span>审阅</span><span>视图</span></div>
          <div class="fx-toolbar">
            <div class="fx-grp"><i></i><small>粘贴</small></div>
            <div class="fx-grp"><i></i><small>字体</small></div>
            <div class="fx-grp"><i></i><small>对齐</small></div>
            <div class="fx-grp"><i></i><small>数字</small></div>
            <div class="fx-grp"><i></i><small>排序</small></div>
            <div class="fx-grp"><i></i><small>图表</small></div>
          </div>
          <div class="fx-grid" id="fx-grid"></div>
          <div class="fx-status"><span>就绪</span><span id="fx-zoom">100%</span></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="restart">🔄 重开</button>
      <button id="share-btn">📤 分享</button>
    </div>

    <section class="records">
      <h2>最近战绩</h2>
      <ul id="record-list"></ul>
    </section>

    <div id="result-overlay" class="result-overlay">
      <div class="result-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <h2 class="result-title" id="result-title">通关！</h2>
        <p class="result-sub" id="result-sub">简单 · 用时 0 秒</p>
        <div class="result-actions">
          <button id="result-again" class="result-btn primary" type="button">再来一局</button>
          <button id="result-share" class="result-btn" type="button">分享战绩</button>
        </div>
      </div>
    </div>

    <div id="share-overlay" class="share-overlay">
      <img id="share-card-img" class="share-card-img" src="" alt="分享卡片">
      <p class="share-hint">长按图片保存，发到微信群</p>
      <button id="share-close" class="share-close">关闭</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
