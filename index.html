<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>扫雷</title>
  <meta name="api-base" content="https://api.w1lkin.site">
  <script src="https://api.w1lkin.site/sdk.js"></script>
  <meta name="description" content="经典扫雷，三档难度、最近战绩云端保存，支持分享卡片。">
  <meta property="og:title" content="扫雷">
  <meta property="og:description" content="经典扫雷，三档难度，挑战你的最快通关纪录！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mine-sweeper-2f1.pages.dev/">
  <meta property="og:image" content="https://mine-sweeper-2f1.pages.dev/share-card.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 社交平台接入样式 */
    .gp-oa { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .gp-lb { margin: 14px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .gp-lb h2 { font-size: 15px; margin: 0 0 10px; }
    .gp-lb ol { list-style: none; margin: 0; padding: 0; }
    .gp-lb li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .gp-lb li:last-child { border-bottom: none; }
    .gp-rank { width: 22px; height: 22px; border-radius: 50%; background: #81C784; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; }
    .gp-lbn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gp-score { color: #2e7d32; font-weight: 600; }
    .gp-empty { color: #8a9790; font-size: 13px; padding: 8px 0; }
  </style>
</head>
<body>

  <main class="app">
    <header class="topbar">
      <h1>扫雷</h1>
      <div class="stats">
        <span id="mine-count">💣 0</span>
        <span id="timer">⏱ 0</span>
      </div>
    </header>
    <button id="immerse-exit" class="immerse-exit" type="button" title="退出沉浸" aria-label="退出沉浸">✕</button>

    <section class="difficulty">
      <button data-diff="easy" class="active">初级 9×9</button>
      <button data-diff="medium">中级 16×16</button>
      <button data-diff="hard">高级 30×16</button>
    </section>

    <div class="controls">
      <label class="toggle"><input type="checkbox" id="autoflag-toggle"> <span>自动标雷</span></label>
      <button id="pause-btn" type="button">⏸ 暂停</button>
      <button id="immerse-btn" type="button">🙈 沉浸</button>
    </div>

    <div class="board-wrap">
      <section id="board" class="board"></section>
      <div class="board-scrollbar" id="board-scrollbar"><div class="bsb-thumb" id="bsb-thumb"></div></div>
      <div id="pause-overlay" class="pause-overlay">
        <div class="fake-excel">
          <div class="fx-title">表格文档 · Q3预算执行表.xlsx</div>
          <div class="fx-ribbon"><span>文件</span><span>开始</span><span>插入</span><span>页面布局</span><span>公式</span><span>数据</span><span>审阅</span><span>视图</span></div>
          <div class="fx-toolbar">
            <div class="fx-grp"><i></i><small>粘贴</small></div>
            <div class="fx-grp"><i></i><small>字体</small></div>
            <div class="fx-grp"><i></i><small>对齐</small></div>
            <div class="fx-grp"><i></i><small>数字</small></div>
            <div class="fx-grp"><i></i><small>排序</small></div>
            <div class="fx-grp"><i></i><small>图表</small></div>
          </div>
          <div class="fx-grid" id="fx-grid"></div>
          <div class="fx-status"><span>就绪</span><span id="fx-zoom">100%</span></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="restart">🔄 重开</button>
      <button id="share-btn">📤 分享</button>
    </div>

    <section class="records">
      <h2>最近战绩</h2>
      <ul id="record-list"></ul>
    </section>

    <section id="gp-leaderboard" class="gp-lb">
      <h2>🏆 天梯榜（最快通关）</h2>
      <ol id="gp-lb-list"></ol>
    </section>

    <div id="result-overlay" class="result-overlay">
      <div class="result-card">
        <div class="result-emoji" id="result-emoji">🎉</div>
        <h2 class="result-title" id="result-title">通关！</h2>
        <p class="result-sub" id="result-sub">简单 · 用时 0 秒</p>
        <div class="result-actions">
          <button id="result-again" class="result-btn primary" type="button">再来一局</button>
          <button id="result-share" class="result-btn" type="button">分享战绩</button>
        </div>
      </div>
    </div>

    <div id="share-overlay" class="share-overlay">
      <img id="share-card-img" class="share-card-img" src="" alt="分享卡片">
      <p class="share-hint">长按图片保存，发到微信群</p>
      <button id="share-close" class="share-close">关闭</button>
    </div>
  </main>

  <!-- 动态加载 SDK（?api= 可覆盖本地联调），加载完成再加载 game.js -->
  <script>
    window.__GP_API_BASE__ = new URLSearchParams(location.search).get('api') || 'https://api.w1lkin.site';
    (function () {
      var s = document.createElement('script');
      s.src = window.__GP_API_BASE__ + '/sdk.js';
      function loadGame() {
        var g = document.createElement('script');
        g.src = 'game.js';
        document.body.appendChild(g);
      }
      s.onload = function () {
        var GP = window.GamePlatform;
        GP.init();
        // 未登录统一跳转到总入口登录（带 redirect 回来带 token）
        if (!GP.getToken()) { GP.redirectToLogin(); return; }
        loadGame();
      };
      s.onerror = loadGame; // SDK 不可用时游戏仍可玩（无社交功能）
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
